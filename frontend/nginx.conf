server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Carimbo de frescor da imagem (frontend/image-stamp.mjs). Nunca em
    # cache: o gate precisa ler o valor ATUAL a cada chamada, senão uma
    # imagem nova por trás de um cache antigo mentiria o hash velho.
    location = /__image-stamp {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-store";
    }

    # index.html nunca em cache: é o único arquivo cujo NOME não muda entre
    # deploys, e ele referencia os assets com hash no nome. Cacheá-lo faria
    # o browser continuar pedindo JS/CSS de um deploy anterior que pode já
    # ter sido substituído.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Assets com hash de conteúdo no nome (padrão do Vite: assets/x-<hash>.js).
    # O nome MUDA se o conteúdo mudar, então "immutable" é seguro: nunca
    # serve um arquivo velho com o nome de um novo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fallback de SPA: qualquer rota sem arquivo correspondente cai no
    # index.html, e o react-router-dom assume dali. Sem isto, um reload em
    # /dashboard (ou qualquer rota interna) devolve 404 do nginx puro.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
